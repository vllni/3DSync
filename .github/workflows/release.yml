name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: read

env:
  BUILD_IMAGE: ghcr.io/vllni/3dsync-devcontainer:latest

jobs:
  # The app prints the version from source/version.h and the assets are named
  # after the tag, so a tag that disagrees with the header ships a build that
  # misreports itself — and every bug report against it names the wrong version.
  # Checked in its own job so a mismatch fails before anything is built or
  # uploaded, and the fix is a header bump or a retag rather than a deleted
  # release.
  version:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag matches source/version.h
        run: |
          code="$(sed -n 's/^.*#define[[:space:]]*APP_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' source/version.h)"
          # The leading "v" is conventional in the tag and absent from the code.
          tag="${GITHUB_REF_NAME#v}"
          echo "source/version.h: ${code:-<not found>}"
          echo "release tag:      $tag (${GITHUB_REF_NAME})"

          if [ -z "$code" ]; then
            echo "::error file=source/version.h::APP_VERSION could not be read — keep it as a single #define APP_VERSION \"x.y.z\" line."
            exit 1
          fi
          if [ "$code" != "$tag" ]; then
            echo "::error file=source/version.h::Tag ${GITHUB_REF_NAME} does not match APP_VERSION \"$code\". Bump source/version.h and retag, or publish the release as v${code}."
            exit 1
          fi

  build-and-upload:
    name: Build and Upload
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare build image
        run: docker pull "$BUILD_IMAGE" || docker build -f docker/3dsync-devcontainer.Dockerfile -t "$BUILD_IMAGE" .

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "$BUILD_IMAGE" \
            sh -lc 'git config --global --add safe.directory /workspace && git config --global --add safe.directory /workspace/buildtools && make'
          sudo chown -R "$USER" output/

      - name: Rename release assets
        run: |
          cp output/3DSync.zip output/3DSync-${{ github.ref_name }}.zip
          cp output/3ds-arm/3ds/3DSync/3DSync.3dsx output/3ds-arm/3ds/3DSync/3DSync-${{ github.ref_name }}.3dsx
          cp output/3ds-arm/3DSync.3ds output/3ds-arm/3DSync-${{ github.ref_name }}.3ds
          cp output/3ds-arm/3DSync.cia output/3ds-arm/3DSync-${{ github.ref_name }}.cia

      - name: Upload release assets
        run: |
          gh release upload "${{ github.ref_name }}" --clobber \
            output/3DSync-${{ github.ref_name }}.zip \
            output/3ds-arm/3ds/3DSync/3DSync-${{ github.ref_name }}.3dsx \
            output/3ds-arm/3DSync-${{ github.ref_name }}.3ds \
            output/3ds-arm/3DSync-${{ github.ref_name }}.cia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate FBI install QR code
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qrencode
          # FBI's "Scan QR Code" remote install expects the plain URL of the .cia.
          qrencode -o "output/3DSync-${{ github.ref_name }}-QR.png" -s 8 -m 3 -l M "$CIA_URL"
        env:
          CIA_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/3DSync-${{ github.ref_name }}.cia

      - name: Upload QR code asset
        run: |
          gh release upload "${{ github.ref_name }}" --clobber \
            "output/3DSync-${{ github.ref_name }}-QR.png"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject QR code into release notes
        run: |
          # Drop any previously injected block so re-runs replace it instead of stacking.
          gh release view "${{ github.ref_name }}" --json body -q .body > body.md
          sed -n '/<!-- 3dsync-qr:start -->/q;p' body.md > notes.md
          # Command substitution drops trailing newlines, so re-runs don't accrue blank lines.
          printf '%s\n' "$(cat notes.md)" > notes.md
          {
            echo
            echo '<!-- 3dsync-qr:start -->'
            echo '## Install on your 3DS'
            echo
            echo 'Open **FBI** -> **Remote Install** -> **Scan QR Code**, then scan:'
            echo
            echo "<img src=\"$QR_URL\" alt=\"QR code to install 3DSync $TAG with FBI\" width=\"260\">"
            echo
            echo "Direct link: [\`3DSync-$TAG.cia\`]($CIA_URL)"
            echo '<!-- 3dsync-qr:end -->'
          } >> notes.md
          gh release edit "${{ github.ref_name }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          CIA_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/3DSync-${{ github.ref_name }}.cia
          QR_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/3DSync-${{ github.ref_name }}-QR.png
