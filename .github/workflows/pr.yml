name: PR Validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read

env:
  BUILD_IMAGE: ghcr.io/vllni/3dsync-devcontainer:latest

jobs:
  # The unit tests build for the host, not the 3DS: the logic they cover is kept
  # free of libctru, libcurl and libsmb2 so it can run without hardware.  Split
  # from the build job so a logic failure and a toolchain failure are easy to
  # tell apart, and so both report even when one fails.
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mbedtls
        run: sudo apt-get update -q && sudo apt-get install -y -q libmbedtls-dev

      - name: Run tests
        run: make -C tests

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The published image is only rebuilt on pushes to master, so a PR that
      # changes the image definition has to build it here — pulling would
      # otherwise succeed and silently test against the old toolchain.
      - name: Prepare build image
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
               | grep -qE '^docker/.*Dockerfile$'; then
            echo "Dockerfile changed in this PR — building the image locally"
            docker build -f docker/3dsync-devcontainer.Dockerfile -t "$BUILD_IMAGE" .
          else
            docker pull "$BUILD_IMAGE" \
              || docker build -f docker/3dsync-devcontainer.Dockerfile -t "$BUILD_IMAGE" .
          fi

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "$BUILD_IMAGE" \
            sh -lc 'git config --global --add safe.directory /workspace && git config --global --add safe.directory /workspace/buildtools && make'
