[global]
    server role = standalone server
    # 3DSync speaks SMB2/3 only; refusing SMB1 matches a modern NAS.
    server min protocol = SMB2_02
    disable netbios = yes
    smb ports = 1445
    map to guest = never
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    log level = 1 auth_audit:3

[3ds]
    path = /srv/smb/3ds
    read only = no
    valid users = 3dsync
    force user = 3dsync

# SMB3 encryption required, as some NAS defaults and Windows shares do.
[3ds-encrypted]
    path = /srv/smb/3ds-encrypted
    read only = no
    valid users = 3dsync
    force user = 3dsync
    smb encrypt = required

# No login at all: 3DSync connects as a null session when User= is empty.
[3ds-public]
    path = /srv/smb/3ds-public
    read only = no
    guest ok = yes
    guest only = yes
    force user = 3dsync
