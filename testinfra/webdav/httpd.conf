ServerRoot "/usr/local/apache2"
ServerName localhost
# Ports come from the environment: on the host network they are the real ones.
Listen ${WEBDAV_HTTP_PORT}
Listen ${WEBDAV_HTTPS_PORT}

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule alias_module modules/mod_alias.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

User daemon
Group daemon
TypesConfig conf/mime.types
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %u \"%r\" %>s %b depth=%{Depth}i" dav
CustomLog /proc/self/fd/1 dav

DavLockDB /var/lib/dav/lockdb
DocumentRoot /srv/webdav
<Directory />
    Require all denied
</Directory>

# /dav/ answers Depth: infinity, like Nextcloud does.
Alias /dav /srv/webdav/dav
<Directory /srv/webdav/dav>
    Dav On
    DavDepthInfinity On
    AuthType Basic
    AuthName "3DSync test"
    AuthUserFile /usr/local/apache2/conf/htpasswd
    Require valid-user
</Directory>

# /dav-nodepth/ refuses Depth: infinity with 403, Apache's own default, to
# exercise the one-level-at-a-time fallback.
Alias /dav-nodepth /srv/webdav/dav-nodepth
<Directory /srv/webdav/dav-nodepth>
    Dav On
    DavDepthInfinity Off
    AuthType Basic
    AuthName "3DSync test"
    AuthUserFile /usr/local/apache2/conf/htpasswd
    Require valid-user
</Directory>

# /dav-anon/ asks for no credentials, for a 3DSync.ini with no User=.
Alias /dav-anon /srv/webdav/dav-anon
<Directory /srv/webdav/dav-anon>
    Dav On
    DavDepthInfinity On
    Require all granted
</Directory>

SSLSessionCache shmcb:/var/lib/dav/ssl_scache(512000)
<VirtualHost *:${WEBDAV_HTTPS_PORT}>
    SSLEngine on
    SSLCertificateFile /etc/ssl/webdav/cert.pem
    SSLCertificateKeyFile /etc/ssl/webdav/key.pem
</VirtualHost>
